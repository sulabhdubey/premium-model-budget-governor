<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Premium Model Budget Governor</title>
  <desc id="desc">A clean product graphic showing cheap models doing broad work and a premium model judging a compact capsule.</desc>
  <rect width="1200" height="630" fill="#f5f7f8"/>
  <rect x="64" y="64" width="1072" height="502" rx="24" fill="#ffffff" stroke="#dce4ea"/>
  <text x="104" y="128" fill="#0f8b8d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">PREMIUM MODEL BUDGET GOVERNOR</text>
  <text x="104" y="190" fill="#101317" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Use frontier models</text>
  <text x="104" y="252" fill="#101317" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">for judgment, not waste.</text>
  <text x="108" y="308" fill="#66707d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Route broad work to cheaper models. Send premium models only compact, safe decisions.</text>
  <g transform="translate(104 382)">
    <rect width="190" height="86" rx="12" fill="#edf7f7" stroke="#acd8d7"/>
    <text x="24" y="36" fill="#0a6567" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Sol / Terra</text>
    <text x="24" y="62" fill="#0a6567" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">explore + build</text>
  </g>
  <path d="M314 425 H455" stroke="#8aa0ad" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g transform="translate(475 370)">
    <rect width="210" height="110" rx="12" fill="#fff7e8" stroke="#f1c98c"/>
    <text x="24" y="34" fill="#8a5a00" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Safe Capsule</text>
    <text x="24" y="62" fill="#8a5a00" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">ranked evidence</text>
    <text x="24" y="84" fill="#8a5a00" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">scanned + scored</text>
  </g>
  <path d="M705 425 H846" stroke="#8aa0ad" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g transform="translate(866 382)">
    <rect width="190" height="86" rx="12" fill="#fff0f3" stroke="#ef9aad"/>
    <text x="24" y="36" fill="#a4133c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Astra</text>
    <text x="24" y="62" fill="#a4133c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">approve / patch</text>
  </g>
  <rect x="104" y="506" width="312" height="34" rx="17" fill="#101317"/>
  <text x="126" y="529" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Sol-parity routing + prompt-free telemetry</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8aa0ad"/>
    </marker>
  </defs>
</svg>

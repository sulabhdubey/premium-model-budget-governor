  <text x="98" y="212" fill="#f5f0e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Budget Governor</text>
  <text x="100" y="276" fill="#9fd8d2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600">Use frontier models for judgment, not waste.</text>
  <g transform="translate(100 344)">

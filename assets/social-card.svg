    <path d="M265 46h88" stroke="#9fd8d2" stroke-width="5" stroke-linecap="round"/>
    <path d="M344 28l24 18-24 18" fill="none" stroke="#9fd8d2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="390" y="0" width="245" height="92" rx="12" fill="#1d312c" stroke="#63845f"/>
    <text x="418" y="39" fill="#f5f0e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Compress</text>
    <text x="418" y="70" fill="#b9c8b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">scanned capsule</text>
    <path d="M655 46h88" stroke="#d4b36a" stroke-width="5" stroke-linecap="round"/>
    <path d="M734 28l24 18-24 18" fill="none" stroke="#d4b36a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

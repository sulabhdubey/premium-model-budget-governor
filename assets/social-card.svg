<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Premium Model Budget Governor social card</title>
  <desc id="desc">A launch graphic for Premium Model Budget Governor showing cheap model exploration flowing into compact premium model judgment.</desc>
  <rect width="1200" height="630" fill="#071013"/>
  <rect x="64" y="64" width="1072" height="502" rx="18" fill="#0f1c20" stroke="#26434a" stroke-width="2"/>

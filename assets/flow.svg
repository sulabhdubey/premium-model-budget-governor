<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Governor workflow</title>
  <desc id="desc">Workflow from cheap model exploration to capsule checks and one premium model decision.</desc>
  <rect width="980" height="360" fill="#ffffff"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="32" y="52" fill="#101317" font-size="30" font-weight="800">The Hybrid Flow</text>
    <text x="32" y="84" fill="#66707d" font-size="17">Spend premium tokens only where they change the decision.</text>
    <g transform="translate(32 132)">
      <rect width="156" height="92" rx="10" fill="#edf7f7" stroke="#acd8d7"/>
      <text x="18" y="36" fill="#086668" font-size="18" font-weight="700">1. Explore</text>
      <text x="18" y="64" fill="#086668" font-size="14">Sol / Terra / Luna</text>
    </g>
    <path d="M205 178 H272" stroke="#8aa0ad" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(292 132)">
      <rect width="156" height="92" rx="10" fill="#f8fafb" stroke="#dce4ea"/>
      <text x="18" y="36" fill="#101317" font-size="18" font-weight="700">2. Select</text>
      <text x="18" y="64" fill="#66707d" font-size="14">ranked evidence</text>
    </g>
    <path d="M465 178 H532" stroke="#8aa0ad" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(552 132)">
      <rect width="156" height="92" rx="10" fill="#fff7e8" stroke="#f1c98c"/>
      <text x="18" y="36" fill="#8a5a00" font-size="18" font-weight="700">3. Guard</text>
      <text x="18" y="64" fill="#8a5a00" font-size="14">scan + score</text>
    </g>
    <path d="M725 178 H792" stroke="#8aa0ad" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(812 132)">
      <rect width="136" height="92" rx="10" fill="#fff0f3" stroke="#ef9aad"/>
      <text x="18" y="36" fill="#a4133c" font-size="18" font-weight="700">4. Judge</text>
      <text x="18" y="64" fill="#a4133c" font-size="14">Astra once</text>
    </g>
    <rect x="32" y="268" width="916" height="48" rx="10" fill="#101317"/>
    <text x="56" y="299" fill="#ffffff" font-size="17" font-weight="700">Then route execution back to cheaper models and record prompt-free telemetry.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#8aa0ad"/>
    </marker>
  </defs>
</svg>

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,mcp,documents]"
      - name: Test
        run: python -m pytest
      - name: Check public text patterns
        run: python scripts/check_publication.py README.md --docs-root docs artifacts/context-trial-2026-09-08/counters.csv artifacts/tool-skill-trial-2026-09-08/counters.csv

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional runtime and audit tooling
        run: python -m pip install -e ".[mcp,documents]" "pip-audit==2.10.1"
      - name: Check known dependency advisories
        run: |
          mkdir -p build
          python -m pip_audit --skip-editable --progress-spinner off --format json --output build/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisories
          path: build/dependency-audit.json

  isolated-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - name: Verify isolated core, MCP and documents installation and removal
        shell: bash
        run: python scripts/check_installation.py --wheel build/wheels/*.whl --regression --mcp --documents --report build/install-check.json
      - name: Build and pattern-check plugin archive
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_plugin.py --output build/governor-plugin.zip
          python scripts/check_publication.py build/governor-plugin.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ runner.os }}
          path: |
            build/*install-check.json
            build/governor-plugin.zip

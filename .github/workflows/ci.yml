name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Test
        run: python -m pytest
      - name: Check public text patterns
        run: python scripts/check_publication.py README.md docs/OUTREACH_KIT.md docs/FIELD_TRIAL_2026_09_07.md docs/LAUNCH_PLAN.md docs/CONTEXT_TRIAL_RESULTS_2026_09_08.md docs/TOOL_SKILL_TRIAL_2026_09_08.md docs/RELEASE_CANDIDATE_RC6.md artifacts/context-trial-2026-09-08/counters.csv artifacts/tool-skill-trial-2026-09-08/counters.csv

  isolated-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir build/wheels
      - name: Verify isolated install and removal
        shell: bash
        run: python scripts/check_installation.py --wheel build/wheels/*.whl --regression --report build/install-check.json
      - name: Verify optional MCP installation
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/check_installation.py --wheel build/wheels/*.whl --mcp --report build/mcp-install-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ runner.os }}
          path: build/*install-check.json

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "premium-model-budget-governor"
version = "0.5.0.dev1"
description = "Use frontier AI models for judgment, not waste."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Sulabh Dubey" }
]
keywords = [
  "codex",
  "ai-agents",
  "llm-routing",
  "model-routing",
  "prompt-caching",
  "developer-tools",
  "budget-governance"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2,<3"]
documents = ["python-docx>=1.2,<2", "defusedxml>=0.7.1,<1"]

[project.scripts]
pm-bg = "premium_model_budget_governor.cli:main"

[project.urls]
Homepage = "https://github.com/sulabhdubey/premium-model-budget-governor"
Demo = "https://sulabhdubey.github.io/premium-model-budget-governor/"
Repository = "https://github.com/sulabhdubey/premium-model-budget-governor"
Issues = "https://github.com/sulabhdubey/premium-model-budget-governor/issues"
Documentation = "https://github.com/sulabhdubey/premium-model-budget-governor/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
